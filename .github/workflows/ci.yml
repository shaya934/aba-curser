name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aba
          POSTGRES_PASSWORD: aba_local_only
          POSTGRES_DB: aba
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aba -d aba"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run setup
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npx playwright install --with-deps chromium
      - name: Install local S3 emulator for contract tests
        run: |
          python -m venv /tmp/brightpath-s3-venv
          /tmp/brightpath-s3-venv/bin/python -m pip install 'moto[server]==5.1.14'
      - name: Check S3 storage and durable report recovery
        run: |
          /tmp/brightpath-s3-venv/bin/python -m moto.server -H 127.0.0.1 -p 5000 > /tmp/brightpath-s3.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000 > /dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:5000 > /dev/null; then
            cat /tmp/brightpath-s3.log
            exit 1
          fi
          npm run test:storage
      - run: npm run typecheck && npm run build
      - name: Run service, HTTP and browser acceptance tests
        run: |
          npm start > /tmp/brightpath-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/login > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/login > /dev/null
          npm test
          npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
