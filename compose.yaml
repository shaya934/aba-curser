services:
  db:
    image: postgres:17
    container_name: aba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aba
      POSTGRES_PASSWORD: aba_local_only
      POSTGRES_DB: aba
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aba -d aba"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
    name: aba-postgres-data
